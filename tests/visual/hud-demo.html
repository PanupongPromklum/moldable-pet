<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>HUD demo — Moldable Pet (S1-04, S2, S3, S4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../src/ui/tokens.css">
<link rel="stylesheet" href="../../src/ui/hud.css">
<style>
  /* Fake room: stands in for the 3D scene. Dark = prop's evening look (S2-05), approximated. */
  :root { --room-living: #F2F1FB; --floor-living: #E6E4F6; --room-kitchen: #FBF0F4; --floor-kitchen: #F4E1E9;
    --room-bathroom: #EDF4F6; --floor-bathroom: #DCEAEE; --room-blob: #FFFFFF; }
  :root[data-theme="dark"] { --room-living: #2A2838; --floor-living: #222030; --room-kitchen: #33282F; --floor-kitchen: #2A2127;
    --room-bathroom: #243035; --floor-bathroom: #1C272B; --room-blob: #3A3850; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--room-living); font-family: 'Prompt', 'Poppins', sans-serif; }
  #room { position: fixed; inset: 0; transition: background-color .4s cubic-bezier(0.22,1,0.36,1); }
  #room .floor { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; transition: background-color .4s; }
  #room .blob { transition: background-color .4s; }
  @media (prefers-reduced-motion: reduce) { #room, #room .floor, #room .blob { transition: none; } }
  #room .blob { position: absolute; border-radius: 54% 46% 52% 48% / 48% 54% 46% 52%; opacity: .7; background: var(--room-blob); }
  #room[data-room="living"] { background: var(--room-living); } #room[data-room="living"] .floor { background: var(--floor-living); }
  #room[data-room="kitchen"] { background: var(--room-kitchen); } #room[data-room="kitchen"] .floor { background: var(--floor-kitchen); }
  #room[data-room="bathroom"] { background: var(--room-bathroom); } #room[data-room="bathroom"] .floor { background: var(--floor-bathroom); }
  #pet { position: fixed; left: 50%; width: 200px; height: 190px; margin-left: -100px; object-fit: contain; pointer-events: none; }
  /* S4: the fake room shows the furniture item of the open tab (equipped or being tried) */
  #furn { position: fixed; left: 4%; width: 116px; height: 116px; object-fit: contain; pointer-events: none; display: none; }
  #ghost { position: fixed; left: 0; top: 0; width: 64px; height: 64px; pointer-events: none; z-index: 20; display: none; transform-origin: center; }
  .drop { position: fixed; top: -40px; width: 36px; height: 36px; pointer-events: none; z-index: 1; }
  /* Demo panel (not part of the HUD) */
  #demo-toggle { position: fixed; left: 0; top: 50%; z-index: 30; transform: translateY(-50%); border: none; border-radius: 0 12px 12px 0;
    background: #252941; color: #fff; font: 600 12px/1.4 'Poppins', sans-serif; padding: 10px 6px; writing-mode: vertical-rl; cursor: pointer; }
  #demo { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); z-index: 31; width: 220px; max-height: 84vh; overflow: auto;
    background: #fff; border-radius: 20px; padding: 12px; box-shadow: 0 8px 30px rgba(37,41,65,.16); display: flex; flex-direction: column; gap: 6px;
    font-size: 13px; line-height: 1.4; color: #252941; }
  #demo[hidden] { display: none; }
  #demo b { font-family: 'Poppins', sans-serif; font-size: 12px; color: #5C5F75; margin-top: 4px; }
  #demo button { min-height: 36px; border: 1px solid #D9D6EA; border-radius: 12px; background: #F5F5F5; font: 500 13px/1.4 'Prompt', sans-serif; color: #252941; cursor: pointer; text-align: left; padding: 6px 10px; }
  #demo .row { display: flex; gap: 6px; } #demo .row button { flex: 1; }
</style>
</head>
<body>
<div id="room" data-room="living" aria-hidden="true">
  <div class="floor"></div>
  <div class="blob" style="left:8%; top:24%; width:28vw; max-width:140px; height:150px;"></div>
  <div class="blob" style="right:9%; top:26%; width:22vw; max-width:100px; height:100px;"></div>
</div>
<img id="furn" alt="">
<img id="pet" alt="">
<div id="ghost"></div>
<div id="hud"></div>

<button id="demo-toggle" type="button">DEMO</button>
<div id="demo" hidden>
  <b>Needs</b>
  <button data-a="needs">วนสถานะความต้องการ</button>
  <b>Room</b>
  <div class="row"><button data-a="room-1">ก่อน</button><button data-a="room+1">ถัด</button></div>
  <button data-a="toilet">ห้องน้ำ: ก่อนนั่ง → นั่ง → กด</button>
  <b>Mic / Camera</b>
  <button data-a="mic">วนไมค์</button>
  <button data-a="cam">วนกล้อง (รวม error)</button>
  <b>Messages</b>
  <button data-a="say">ลูกโป่งคำพูด</button>
  <button data-a="toast">Toast ปวดห้องน้ำ</button>
  <button data-a="toast2">Toast ทั่วไป</button>
  <button data-a="coach">สลับ coach mark</button>
  <div class="row"><button data-a="coins">+20 เหรียญ</button><button data-a="coins-">−50</button></div>
  <b>Screens</b>
  <button data-a="select">หน้าเลือกตัวละคร (เปิดเกม)</button>
  <button data-a="ward">ตู้เสื้อผ้า</button>
  <button data-a="decor">แต่งห้อง (ห้องนี้)</button>
  <button data-a="thumbs">แต่งห้อง: รูปมาช้า</button>
  <button data-a="game">มินิเกม ฝนขนม (การ์ดเลือกวิธีเล่น)</button>
  <button data-a="theme">สลับไฟ (light / dark)</button>
  <button data-a="camfail">กล้องใช้ไม่ได้ → กลับเป็นนิ้ว</button>
</div>

<script type="module">
import { createHUD, HUD_ROOMS } from '../../src/ui/hud.js';
import { foodIcon } from '../../src/ui/icons.js';

const q = new URLSearchParams(location.search);
const CHARS = [
  { key: 'splat', name: 'ใหม่', role: 'CI / Branding', mbti: 'INFJ' },
  { key: 'pill', name: 'ปาม', locked: true },
  { key: 'gumdrop', name: 'มิน', role: 'CEO · ดูแลภาพรวม', mbti: 'ENFJ' },
  { key: 'diamond', name: 'แอ๊ค', role: 'UI / Motion', mbti: 'ISFJ' },
  { key: 'cloud', name: 'ฟ้า', role: 'Frontend · Handoff', mbti: 'INFJ' },
  { key: 'flower', name: 'ไผ่', role: 'UX / CX', mbti: 'ENFP' },
];
const FOODS = [
  { id: 'onigiri', name: 'ข้าวปั้น' }, { id: 'banana', name: 'กล้วย' }, { id: 'cupcake', name: 'คัพเค้ก' },
  { id: 'apple', name: 'แอปเปิล' }, { id: 'bun', name: 'ซาลาเปา' }, { id: 'milk', name: 'นม' },
];
const PORTRAIT = { splat: 'char_mai', pill: 'char_two', gumdrop: 'char_min', diamond: 'char_ack', cloud: 'char_fah', flower: 'char_pai' };
const PRESETS = [
  { hunger: 0.8, toilet: 0.65, fun: 0.55, social: 0.2 },
  { hunger: 0.22, toilet: 0.6, fun: 0.7, social: 0.75 },
  { hunger: 0.7, toilet: 0.08, fun: 0.5, social: 0.6 },
  { hunger: 1, toilet: 1, fun: 1, social: 1 },
  { hunger: 0.05, toilet: 0.18, fun: 0.4, social: 0.9 },
];
const MICS = ['off', 'listening', 'recording', 'playing'];
const CAMS = ['off', 'loading', 'on', 'error'];

let WARD = { slots: {}, items: [] };
try { WARD = await (await fetch('../../assets/data/wardrobe.json')).json(); } catch { /* demo keeps going */ }
let FURN = { rooms: {}, items: [], themes: {} };
try { FURN = await (await fetch('../../assets/data/furniture.json')).json(); } catch { /* demo keeps going */ }

/** Stand-in for wire's createFurniturePreview → PNG thumbnails (S4-06): soft clay-ish shapes on a canvas. */
const THUMB_INKS = { basic: [['#D6E2EC', '#9BB0DE'], ['#EADFF2', '#CBA5D1'], ['#F8DCE8', '#EB92B3']], xmas: [['#F1D4DC', '#B9798D'], ['#D7E6E1', '#7FA39A'], ['#F6EADF', '#D9B9A0']] };
function fakeThumb(it, i) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const [a, b] = THUMB_INKS[it.theme === 'xmas' ? 'xmas' : 'basic'][i % 3];
  const fill = (y0, y1) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; };
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
  g.fillStyle = 'rgba(37,41,65,.12)'; g.beginPath(); g.ellipse(64, 112, 46, 8, 0, 0, Math.PI * 2); g.fill();
  const slot = it.slot;
  if (slot === 'sofa') { g.fillStyle = fill(34, 70); rr(22, 34, 84, 44, 18); g.fillStyle = fill(60, 100); rr(16, 62, 96, 40, 16); }
  else if (slot === 'rug') { g.fillStyle = fill(70, 112); g.beginPath(); g.ellipse(64, 92, 54, 22, 0, 0, Math.PI * 2); g.fill(); }
  else if (slot === 'wall') { g.fillStyle = fill(24, 96); rr(26, 22, 76, 64, 16); g.fillStyle = 'rgba(255,255,255,.55)'; rr(38, 34, 52, 40, 10); }
  else if (slot === 'window' || slot === 'mirror') { g.fillStyle = fill(16, 108); g.beginPath(); g.ellipse(64, 62, 38, 46, 0, 0, Math.PI * 2); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(64, 62, 28, 36, 0, 0, Math.PI * 2); g.fill(); }
  else if (slot === 'corner') { g.fillStyle = fill(10, 90); g.beginPath(); g.moveTo(64, 10); g.quadraticCurveTo(112, 86, 96, 88); g.lineTo(32, 88); g.quadraticCurveTo(16, 86, 64, 10); g.fill(); g.fillStyle = '#CBA5D1'; rr(48, 84, 32, 24, 8); }
  else if (slot === 'lamp') { g.fillStyle = fill(14, 54); g.beginPath(); g.ellipse(64, 40, 34, 26, 0, Math.PI, 0); g.fill(); g.fillStyle = '#B7B3CF'; rr(60, 40, 8, 60, 4); rr(42, 98, 44, 10, 5); }
  else if (slot === 'fridge') { g.fillStyle = fill(10, 112); rr(34, 10, 60, 100, 18); g.fillStyle = 'rgba(255,255,255,.6)'; rr(80, 34, 6, 22, 3); }
  else { g.fillStyle = fill(40, 108); rr(28, 44, 72, 62, 18); }
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(46, 46, 12, 6, -0.5, 0, Math.PI * 2); g.fill();
  return c.toDataURL('image/png');
}
const THUMBS = Object.fromEntries(FURN.items.map((it) => {
  const i = FURN.items.filter((x) => x.slot === it.slot && x.room === it.room).indexOf(it);
  return [it.id, fakeThumb(it, i)];
}));

const s = { room: HUD_ROOMS.indexOf(q.get('room')) >= 0 ? q.get('room') : 'living', preset: 0, mic: 0, cam: 0, camHidden: false,
  coins: 240, toilet: 'idle', coach: false, char: CHARS[5], needs: { ...PRESETS[0] }, best: 38,
  theme: 'light', control: q.get('ctl') || 'touch',
  owned: WARD.items.filter((i) => i.starter).map((i) => i.id), outfit: { head: null, eyes: 'glasses-round', body: null }, game: null,
  furniture: Object.fromEntries(Object.keys(FURN.rooms).map((r) => [r, Object.fromEntries(FURN.items.filter((x) => x.room === r && x.default).map((x) => [x.slot, x.id]))])),
  preview: {}, thumbsLate: q.get('thumbs') === 'late' || q.get('thumbs') === 'none' };
if (q.get('coins')) s.coins = +q.get('coins');
// A couple of things bought already, so "มีแล้ว" shows up.
s.owned.push('sofa-cloud', 'rug-flower', 'mat-duck');

const roomEl = document.getElementById('room');
const pet = document.getElementById('pet');
const ghost = document.getElementById('ghost');
const wardData = () => ({ slots: WARD.slots, items: WARD.items, owned: s.owned, outfit: s.outfit, coins: s.coins, charKey: s.char.key, themes: WARD.themes });
const furnEl = document.getElementById('furn');
/** Data as wire passes it to hud.showDecor (contract: Sprint 4 → Furniture shop). */
function decorData() {
  const room = s.room;
  const slots = Object.entries((FURN.rooms[room] || {}).slots || {}).map(([id, v]) => ({ id, label: v.label }));
  const items = FURN.items.filter((x) => x.room === room).map((x) => ({ ...x, thumb: s.thumbsLate ? undefined : THUMBS[x.id] }));
  return { room, slots, items, owned: s.owned, furniture: s.furniture[room], coins: s.coins, themes: FURN.themes };
}
/** Fake room: show the item of a slot (tried or equipped). */
function showFurn(id) {
  if (!id || !THUMBS[id]) { furnEl.style.display = 'none'; return; }
  furnEl.src = THUMBS[id]; furnEl.style.display = 'block';
}

const hud = createHUD(document.getElementById('hud'), {
  onRoom(d) {
    const i = HUD_ROOMS.indexOf(s.room);
    s.room = typeof d === 'number' ? HUD_ROOMS[(i + d + HUD_ROOMS.length) % HUD_ROOMS.length] : d;
    s.toilet = 'idle';
    applyRoom();
  },
  onAction(id) {
    if (id === 'play') openIntro();
    if (id === 'flush') { s.needs.toilet = 1; hud.setNeeds(s.needs); s.toilet = 'idle'; hud.setFlushVisible(false); hud.say('โล่งเลย'); }
  },
  onMic() { s.mic = s.mic === 0 ? 1 : 0; hud.setMic(MICS[s.mic]); },
  onCamera() {
    if (CAMS[s.cam] === 'on') { s.cam = 0; hud.setCamera('off'); return; }
    s.cam = 1; hud.setCamera('loading');
    setTimeout(() => { s.cam = 2; hud.setCamera('on'); }, 1200);
  },
  onCameraView(hidden) { s.camHidden = hidden; hud.setCameraView(hidden); },
  onCharacterChip() { hud.showSelect(CHARS, s.char.key); },
  onSelect(key) { s.char = CHARS.find((c) => c.key === key); hud.setCharacter(s.char); pet.src = `../../assets/ui/characters/${PORTRAIT[key]}.png`; hud.hideSelect(); hud.say(`สวัสดี ${s.char.name}เอง`); },
  onWardrobe() { hud.showWardrobe(wardData()); },
  onEquip(slot, id) { s.outfit = { ...s.outfit, [slot]: id }; hud.updateWardrobe({ outfit: s.outfit }); if (id) hud.say('สวยไหม'); },
  onBuy(id) {
    const it = WARD.items.find((x) => x.id === id);
    if (!it || s.coins < it.price) return;
    s.owned = [...s.owned, id]; s.outfit = { ...s.outfit, [it.slot]: id };
    hud.setCoins(s.coins -= it.price);
    hud.updateWardrobe({ owned: s.owned, outfit: s.outfit, coins: s.coins });
  },
  onDecor() { s.preview = {}; hud.showDecor(decorData()); if (s.thumbsLate && q.get('thumbs') !== 'none') setTimeout(() => { s.thumbsLate = false; hud.updateDecor({ items: decorData().items }); }, 1500); },
  onDecorPreview(slot, id) { s.preview[slot] = id; showFurn(id || s.furniture[s.room][slot]); },
  onDecorEquip(slot, id) { s.furniture[s.room][slot] = id; hud.updateDecor({ furniture: s.furniture[s.room] }); showFurn(id); hud.say('ห้องสวยขึ้นเลย'); },
  onDecorBuy(id) {
    const it = FURN.items.find((x) => x.id === id);
    if (!it || s.coins < it.price) return;
    s.owned = [...s.owned, id]; s.furniture[s.room][it.slot] = id; delete s.preview[it.slot];
    hud.setCoins(s.coins -= it.price);
    hud.updateDecor({ owned: s.owned, furniture: s.furniture[s.room], coins: s.coins });
    showFurn(id);
  },
  onDecorClose() { s.preview = {}; furnEl.style.display = 'none'; },
  onMinigameExit() { stopGame(); hud.endMinigame(); },
  onMinigameAgain() { startGame(); },
  onMinigameControl(id) { s.control = id; },
  onMinigameReady() { startGame(); },
  onThemeToggle() { applyTheme(s.theme === 'dark' ? 'light' : 'dark'); },
  onFoodPointerDown(id, ev) {
    ghost.innerHTML = foodIcon(id, 64); ghost.style.display = 'block';
    const mv = (e) => { ghost.style.transform = `translate(${e.clientX - 32}px, ${e.clientY - 32}px) rotate(-12deg) scale(1.1)`; };
    mv(ev);
    const up = (e) => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      ghost.style.display = 'none';
      const r = pet.getBoundingClientRect();
      if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) {
        s.needs.hunger = Math.min(1, s.needs.hunger + 0.3); hud.setNeeds(s.needs); hud.say('อร่อยจัง'); hud.coach(null);
      }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  },
}, { needs: null });

/** Theme as wire should drive it (S3): <html data-theme>, meta, then hud.setTheme in the same tick. */
function applyTheme(t) {
  s.theme = t;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="color-scheme"]').content = t === 'dark' ? 'only dark' : 'only light';
  hud.setTheme(t);
}
const CONTROLS = [
  { id: 'touch', label: 'นิ้ว / เมาส์', hint: 'ลากนิ้วหรือขยับเมาส์ซ้ายขวา' },
  { id: 'head', label: 'เอียงหัว', hint: 'ใช้กล้อง เอียงหัวซ้ายขวา' },
];
function openIntro() { stopGame(); hud.showMinigameIntro({ controls: CONTROLS, selected: s.control }); }

/** Toilet flow as wire should drive it (S2-03): coach only before sitting; button only while sitting. */
function applyRoom() {
  roomEl.dataset.room = s.room;
  hud.setRoom(s.room);
  hud.setFlushVisible(s.room === 'bathroom' && s.toilet === 'sitting');
  if (s.room === 'kitchen') hud.coach('ลากอาหารไปที่ปาก');
  else if (s.room === 'bathroom') hud.coach(s.toilet === 'sitting' ? null : 'ลากตัวไปที่ชักโครก');
  else hud.coach(s.coach ? 'ลูบหัวไผ่เบาๆ' : null);
}

// ---- Fake Snack Rain round (wire owns the real logic) ----
async function startGame() {
  stopGame();
  const dur = 45;
  const g = s.game = { score: 0, coins: 0, streak: 0, t: dur, timer: 0 };
  hud.hideMinigameIntro();
  await hud.startMinigame({ title: 'ฝนขนม', durationSec: dur, control: s.control });
  if (s.game !== g) return;
  g.timer = setInterval(() => {
    g.t = Math.max(0, g.t - 0.5);
    if (Math.random() < 0.7) { g.streak += 1; g.score += 2 * Math.min(3, 1 + Math.floor(g.streak / 5)); if (Math.random() < 0.25) g.coins += 1; }
    else g.streak = 0;
    hud.updateMinigame({ score: g.score, timeLeft: g.t, streak: g.streak, coins: g.coins });
    if (g.t <= 0) endRound();
  }, 500);
}
function endRound() {
  const g = s.game; if (!g) return;
  clearInterval(g.timer);
  s.best = Math.max(s.best, g.score);
  hud.showMinigameResult({ score: g.score, best: s.best, coins: g.coins });
  hud.setCoins(s.coins += g.coins);
}
function stopGame() { if (s.game) clearInterval(s.game.timer); s.game = null; }

applyTheme(q.get('theme') === 'dark' ? 'dark' : 'light');
hud.setFoods(FOODS);
hud.setCharacter(s.char);
pet.src = `../../assets/ui/characters/${PORTRAIT[s.char.key]}.png`;
hud.setCoins(s.coins);
hud.setNeeds(s.needs);
if (q.get('toilet')) s.toilet = q.get('toilet');
applyRoom();
if (q.get('mic')) hud.setMic(q.get('mic'));
if (q.get('cam')) { s.cam = CAMS.indexOf(q.get('cam')); hud.setCamera(q.get('cam')); }
if (q.get('camhidden')) { s.camHidden = true; hud.setCameraView(true); }
if (q.get('preset')) { s.needs = { ...PRESETS[+q.get('preset')] }; hud.setNeeds(s.needs); }
if (q.get('toast')) hud.toast('ไผ่ปวดห้องน้ำแล้ว', 60000, { icon: 'toilet' });
if (q.get('select')) hud.showSelect(CHARS, q.get('select') === 'settings' ? s.char.key : undefined);
if (q.get('ward')) {
  hud.showWardrobe(wardData());
  if (q.get('ward') === 'body' || q.get('ward') === 'buy') document.querySelector('.mp-ward-tab[data-slot="body"]')?.click();
  if (q.get('ward') === 'buy') document.querySelector('.mp-item[data-id="scarf"]')?.click();
}
if (q.get('ward') === 'xmas' || q.get('ward') === 'xmas-body') {
  if (q.get('ward') === 'xmas-body') document.querySelector('.mp-ward-tab[data-slot="body"]')?.click();
  document.querySelector('.mp-chip[data-filter="xmas"]')?.click();
}
// S4 shop: ?decor=1 | preview | buy | short | xmas   (&tab=<slot> &coins=n &thumbs=late|none)
if (q.get('decor')) {
  const mode = q.get('decor');
  hud.showDecor(decorData());
  if (s.thumbsLate && q.get('thumbs') === 'late') setTimeout(() => { s.thumbsLate = false; hud.updateDecor({ items: decorData().items }); }, 1500);
  const tab = q.get('tab') || (mode === 'short' ? 'corner' : null);
  if (tab) document.querySelector(`.mp-decor .mp-ward-tab[data-slot="${tab}"]`)?.click();
  if (mode === 'xmas') document.querySelector('.mp-decor .mp-chip[data-filter="xmas"]')?.click();
  const tryIt = () => [...document.querySelectorAll('.mp-decor .mp-item')].find((b) => !b.classList.contains('is-owned'));
  if (mode === 'preview' || mode === 'buy' || mode === 'short' || mode === 'xmas') { const card = mode === 'short' ? document.querySelector('.mp-decor .mp-item[data-id="xmas-tree"]') : tryIt(); card?.click(); }
  if (mode === 'buy' || mode === 'short') document.querySelector('.mp-decor .mp-try-buy')?.click();
}
if (q.get('game') === 'intro') openIntro();
if (q.get('game') === 'play') {
  hud.startMinigame({ title: 'ฝนขนม', durationSec: 45, countdown: 0, control: s.control });
  hud.updateMinigame({ score: 128, timeLeft: 31.4, streak: 7, coins: 6 });
}
if (q.get('game') === 'count') hud.startMinigame({ title: 'ฝนขนม', durationSec: 45, control: s.control });
if (q.get('game') === 'result') {
  hud.startMinigame({ title: 'ฝนขนม', durationSec: 45, countdown: 0 });
  hud.updateMinigame({ score: 214, timeLeft: 0, streak: 0, coins: 12 });
  hud.showMinigameResult({ score: 214, best: 214, coins: 12 });
}
hud.say(q.get('say') ?? 'มาคุยกับไผ่หน่อยสิ', 600000);

// Fake pet: sits between the HUD bands; bubble follows its head top every frame.
function frame(t) {
  const vh = window.innerHeight;
  const base = s.room === 'kitchen' ? vh * 0.36 : vh * 0.5;
  const top = base - 95 + Math.sin(t / 700) * 3;
  pet.style.top = `${top}px`;
  furnEl.style.top = `${base - 40}px`;
  hud.placeBubble(window.innerWidth / 2 + 30, top + 6);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener('keydown', (e) => {
  if (document.querySelector('.mp-hud.is-game, .mp-hud.is-wardrobe, .mp-hud.is-decor, .mp-hud.is-selecting')) return;
  if (e.key === 'ArrowLeft') { s.room = HUD_ROOMS[(HUD_ROOMS.indexOf(s.room) + 2) % 3]; s.toilet = 'idle'; applyRoom(); }
  if (e.key === 'ArrowRight') { s.room = HUD_ROOMS[(HUD_ROOMS.indexOf(s.room) + 1) % 3]; s.toilet = 'idle'; applyRoom(); }
});

// Demo panel
const panel = document.getElementById('demo');
document.getElementById('demo-toggle').onclick = () => { panel.hidden = !panel.hidden; };
panel.addEventListener('click', (e) => {
  const a = e.target.closest('button')?.dataset.a; if (!a) return;
  if (a === 'needs') { s.preset = (s.preset + 1) % PRESETS.length; s.needs = { ...PRESETS[s.preset] }; hud.setNeeds(s.needs); }
  if (a === 'room-1' || a === 'room+1') { const d = a === 'room-1' ? 2 : 1; s.room = HUD_ROOMS[(HUD_ROOMS.indexOf(s.room) + d) % 3]; s.toilet = 'idle'; applyRoom(); }
  if (a === 'toilet') {
    if (s.room !== 'bathroom') { s.room = 'bathroom'; s.toilet = 'idle'; }
    else s.toilet = s.toilet === 'sitting' ? 'idle' : 'sitting';
    applyRoom();
  }
  if (a === 'mic') { s.mic = (s.mic + 1) % MICS.length; hud.setMic(MICS[s.mic]); }
  if (a === 'cam') { s.cam = (s.cam + 1) % CAMS.length; hud.setCamera(CAMS[s.cam], CAMS[s.cam] === 'error' ? 'ไม่ได้รับสิทธิ์ใช้กล้อง' : undefined); }
  if (a === 'say') hud.say(['หิวจังเลย', 'มาคุยกับไผ่หน่อยสิ', 'วันนี้เหนื่อยนิดหน่อย แต่ดีใจที่เธอมาหานะ'][Math.floor(Math.random() * 3)]);
  if (a === 'toast') hud.toast('ไผ่ปวดห้องน้ำแล้ว', 4000, { icon: 'toilet' });
  if (a === 'toast2') hud.toast('บันทึกแล้ว');
  if (a === 'coach') { s.coach = !s.coach; applyRoom(); }
  if (a === 'coins') hud.setCoins(s.coins += 20);
  if (a === 'coins-') hud.setCoins(s.coins = Math.max(0, s.coins - 50));
  if (a === 'select') hud.showSelect(CHARS);
  if (a === 'ward') { if (s.room !== 'living') { s.room = 'living'; applyRoom(); } hud.showWardrobe(wardData()); }
  if (a === 'decor') { s.preview = {}; hud.showDecor(decorData()); }
  if (a === 'thumbs') { s.thumbsLate = true; s.preview = {}; hud.showDecor(decorData()); setTimeout(() => { s.thumbsLate = false; hud.updateDecor({ items: decorData().items }); }, 1500); }
  if (a === 'game') openIntro();
  if (a === 'theme') applyTheme(s.theme === 'dark' ? 'light' : 'dark');
  if (a === 'camfail') { s.control = 'touch'; hud.updateMinigame({ control: 'touch' }); hud.toast('เปิดกล้องไม่ได้ เลยเล่นด้วยนิ้วแทนนะ', 4000, { icon: 'camera-off', tone: 'warn' }); }
});
window.__hud = hud;
</script>
</body>
</html>
