<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&family=Poppins:wght@400;500&display=swap">
<style>
/* Visual test bench for src/characters (story S1-02). Not shipped. */
:root { --bg: #f4f3f9; --ink: #1f2130; --muted: #6b6e85; --chip: #ffffff; --line: #e3e2ee; --primary: #5A68B5; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Prompt", "Poppins", system-ui, sans-serif; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 16px; display: grid; gap: 8px; max-width: 760px; margin: 0 auto; max-height: 40vh; overflow-y: auto; }
@media (min-width: 900px) { #ui { left: auto; top: 0; width: 360px; max-height: none; align-content: start; } }
.row { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
.row b { font-size: 12px; color: var(--muted); font-weight: 500; width: 100%; }
button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
#info { position: fixed; left: 16px; top: 14px; font-size: 12px; color: var(--muted); font-family: "Poppins", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="info"></div>
<div id="ui">
  <div class="row" id="chars"><b>ตัวละคร</b></div>
  <div class="row" id="exprs"><b>สีหน้า</b></div>
  <div class="row" id="acts"><b>ท่าทาง</b></div>
  <div class="row" id="poses"><b>ท่า / ปาก</b>
    <button id="sit" type="button" aria-pressed="false">sit</button>
    <button id="carry" type="button" aria-pressed="false">carried</button>
    <button id="talk" type="button" aria-pressed="false">talk</button>
    <label>mouth <input id="mouth" type="range" min="-0.05" max="1" step="0.05" value="-0.05"></label>
    <label>squish <input id="squish" type="range" min="0" max="0.45" step="0.01" value="0"></label>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createCharacter, CHARACTER_KEYS, EXPRESSION_KEYS, ACTION_KEYS } from '../../src/characters/character.js';

const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.setClearColor(0xf4f3f9, 1);
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);
camera.position.set(0, 1.2, 8); camera.lookAt(0, 1, 0);

// lights as in the prototype (the game stage owns these in production)
const hemi = new THREE.HemisphereLight(0xffe1f2, 0x9cb0ea, 2.1); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff5fb, 1.5); key.position.set(1.4, 3.6, 3.2); scene.add(key);
const fill = new THREE.DirectionalLight(0xa8b8ff, .55); fill.position.set(-2.2, -2.4, 2.2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.3); rim.position.set(-2.6, 1.6, -3.2); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3.2, 64), new THREE.MeshStandardMaterial({ color: 0xeceaf6, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

let pet = null, carried = false, sitting = false, talking = false;
const btn = (parent, label, on) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = on; document.getElementById(parent).appendChild(b); return b; };
const charBtns = {}, exprBtns = {};
function setChar(k) {
  if (pet) pet.dispose();
  pet = createCharacter(k); scene.add(pet.object3d);
  hemi.color.copy(pet.lightTint.sky); hemi.groundColor.copy(pet.lightTint.ground);
  pet.setCarried(carried); pet.setSitting(sitting);
  for (const [kk, b] of Object.entries(charBtns)) b.setAttribute('aria-pressed', kk === k);
  for (const [kk, b] of Object.entries(exprBtns)) b.setAttribute('aria-pressed', kk === 'original');
  window.pet = pet;
}
for (const k of CHARACTER_KEYS) charBtns[k] = btn('chars', k, () => setChar(k));
for (const k of EXPRESSION_KEYS) exprBtns[k] = btn('exprs', k, () => { pet.setExpression(k); for (const [kk, b] of Object.entries(exprBtns)) b.setAttribute('aria-pressed', kk === k); });
for (const a of ACTION_KEYS) btn('acts', a, () => pet.play(a));
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; };
toggle('sit', on => { sitting = on; pet.setSitting(on); });
toggle('carry', on => { carried = on; pet.setCarried(on); pet.object3d.position.y = on ? .5 : 0; });
toggle('talk', on => { talking = on; if (!on) pet.setTalkLevel(0); });
document.getElementById('mouth').oninput = e => pet.setMouthOpen(+e.target.value);
document.getElementById('squish').oninput = e => pet.setSquish(0, +e.target.value);

// pointer: tap = poke, drag = stretch, hover = look at
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(), tmp = new THREE.Vector3(), camDir = new THREE.Vector3();
let down = null, grab = null;
function setRay(e) { const r = renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function onPlane(e, through) { setRay(e); camera.getWorldDirection(camDir); plane.setFromNormalAndCoplanarPoint(camDir, through); return ray.ray.intersectPlane(plane, new THREE.Vector3()); }
const info = document.getElementById('info');
renderer.domElement.addEventListener('pointerdown', e => {
  setRay(e); const h = pet.hitTest(ray); if (!h) return;
  info.textContent = `hit: ${h.region}`;
  down = { x: e.clientX, y: e.clientY, h }; renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  const p = onPlane(e, tmp.set(0, 1, 1)); if (p) pet.lookAt(p);
  if (!down) return;
  if (!grab && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) grab = pet.beginGrab(down.h.point);
  if (grab) { const q = onPlane(e, down.h.point); if (q) grab.move(q); }
});
function up(e) {
  if (!down) return;
  if (grab) { const s = grab.release(); info.textContent = `stretch ${s.toFixed(2)}`; if (s > .3) pet.play('jelly'); }
  else pet.poke(down.h.point);
  down = null; grab = null;
}
renderer.domElement.addEventListener('pointerup', up);
renderer.domElement.addEventListener('pointercancel', up);
renderer.domElement.addEventListener('pointerleave', () => pet.lookAt(null));

function resize() {
  const w = innerWidth, h = innerHeight, narrow = w < 900; renderer.setSize(w, h, false); camera.aspect = w / h;
  // fit the pet: further back on portrait screens, and above the bottom control sheet on phones
  const d = 8 * Math.max(1, .9 / camera.aspect);
  camera.position.set(narrow ? 0 : 1.1, 1.2 + (narrow ? -.4 : 0), d); camera.lookAt(narrow ? 0 : 1.1, narrow ? .05 : 1, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
setChar('flower');
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (talking) pet.setTalkLevel(Math.max(0, Math.sin(t * 11) * .5 + Math.sin(t * 4.3) * .4));
  if (carried) pet.object3d.position.x = Math.sin(t * .9) * .6;
  else pet.object3d.position.x = 0;
  pet.update(dt, t);
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
</body>
</html>
