<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F5F5">
<meta name="color-scheme" content="only light">
<script>
  // Manual light/dark (Sprint 3): apply the saved theme before first paint. main.js owns it after boot.
  (function () {
    var t = 'light';
    try { var s = JSON.parse(localStorage.getItem('moldable-pet:v1') || 'null'); if (s && s.settings && s.settings.theme === 'dark') t = 'dark'; } catch (e) { /* storage blocked */ }
    var q = /[?&]theme=(light|dark)/.exec(location.search); if (q) t = q[1];
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'dark') {
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1E1E1E');
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'only dark');
    }
  })();
</script>
<meta name="description" content="Moldable Pet — เลี้ยงก้อนนุ่มของ Moldable ป้อนข้าว พาเข้าห้องน้ำ ลูบหัว ยืด บี้ เล่นด้วยมือผ่านกล้องได้">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Moldable Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/ui/tokens.css">
<link rel="stylesheet" href="src/ui/hud.css">
<style>
  /* Shell layout only (wire). Visual tokens and HUD styles live in src/ui/. */
  /* The theme is manual (lamp button, saved): only data-theme switches it, never the
     system scheme. color-scheme follows it so browsers never auto-invert ("force dark");
     the real dark theme comes from tokens.css (glaze) + room.setTheme (prop) + stage lights (wire). */
  :root { color-scheme: only light;
    --shell-stage-a: #FFFFFF; --shell-stage-b: #E7EFF8; --shell-veil: rgba(245, 245, 245, .38);
    --shell-load-ink: #45121D; --shell-select-bg: rgba(255, 255, 255, .92); --shell-select-ink: #1E1E1E; --shell-select-line: rgba(30, 30, 30, .12); }
  :root[data-theme="dark"] { color-scheme: only dark; --shell-stage-a: #2E3150; --shell-stage-b: #191A2A; --shell-veil: rgba(20, 21, 34, .42);
    --shell-load-ink: #F3E9F7; --shell-select-bg: rgba(38, 40, 62, .94); --shell-select-ink: #F5F5F5; --shell-select-line: rgba(255, 255, 255, .18); }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--mp-bg, #F5F5F5);
    color: var(--mp-ink, #1E1E1E);
    font-family: "Prompt", "Poppins", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #app { position: fixed; inset: 0; overflow: hidden; height: 100vh; height: 100dvh; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 20%, var(--shell-stage-a), var(--shell-stage-b)); }
  #stage > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); opacity: 0; transition: opacity .4s ease; pointer-events: none; filter: saturate(.8); }
  #stage > .veil { position: absolute; inset: 0; background: var(--shell-veil);
    opacity: 0; transition: opacity .4s ease; pointer-events: none; }
  #app.ar #stage > video { opacity: .6; }
  #app.ar #stage > .veil { opacity: 1; }
  /* camera image hidden: the room shows normally, only the soft hands are drawn (S2-04) */
  #app.ar.cam-hidden #stage > video, #app.ar.cam-hidden #stage > .veil { opacity: 0; }
  /* toilet: while sitting only the flush button (S2-03) — fallback until the HUD hides nav itself */
  #app.toilet-sitting #hud .mp-nav { visibility: hidden; }
  #app.minigame #gl { cursor: ew-resize; }
  #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #ov { pointer-events: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 2;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    box-sizing: border-box; }
  #cam-select { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 128px); max-width: min(320px, calc(100% - 32px));
    font: 500 14px/1.2 "Prompt", "Poppins", sans-serif; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--shell-select-line); background: var(--shell-select-bg); color: var(--shell-select-ink); }
  #cam-select[hidden] { display: none; }
  #loading { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 14px;
    background: var(--mp-bg, #F5F5F5); transition: opacity .4s ease; font-size: 16px; color: var(--mp-text, var(--shell-load-ink)); }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .blob { width: 56px; height: 52px; border-radius: 48% 52% 46% 54% / 55% 50% 50% 45%;
    background: linear-gradient(160deg, #E9E0EF, #C8CBE8 55%, #B7C1E4); animation: mp-breathe 2.4s ease-in-out infinite; }
  #loading.failed .blob { animation: none; background: #FFD1D1; }
  #loading [data-text] { margin: 0; padding: 0 16px; text-align: center; }
  @keyframes mp-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .94); } }
  @media (prefers-reduced-motion: reduce) { #loading .blob { animation: none; } #stage > video, #stage > .veil { transition: none; } }
  noscript { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: var(--mp-bg, #F5F5F5); text-align: center; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="cam" playsinline muted autoplay aria-hidden="true"></video>
    <div class="veil"></div>
    <canvas id="ov" aria-hidden="true"></canvas>
  </div>
  <div id="hud"></div>
  <select id="cam-select" hidden aria-label="เลือกกล้อง"></select>
  <div id="loading" role="status" aria-live="polite">
    <div class="blob" aria-hidden="true"></div>
    <p data-text>กำลังโหลด…</p>
  </div>
</div>
<noscript>ต้องเปิด JavaScript เพื่อเล่น Moldable Pet</noscript>
<script>
  // Shows a message if the game module cannot load at all (old browser, network, module error).
  (function () {
    function fail() {
      if (document.documentElement.dataset.boot) return;
      var t = document.querySelector('#loading [data-text]');
      if (t) t.textContent = 'เปิดเกมไม่สำเร็จ ลองรีเฟรชหน้า หรือเปิดด้วย Safari / Chrome รุ่นใหม่';
      var l = document.getElementById('loading'); if (l) l.classList.add('failed');
    }
    window.__mpBootFail = fail;
    window.addEventListener('error', function () { setTimeout(fail, 0); });
    setTimeout(fail, 60000);
  })();
</script>
<script type="module" src="src/main.js" onerror="window.__mpBootFail && window.__mpBootFail()"></script>
</body>
</html>
